<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kerala Health Money Matrix</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Which private hospitals in Kerala are private equity–backed, which belong to corporate chains, and which are family-owned or not-for-profit. Every entry sourced.">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: scrapbook atlas. Warm paper rail with a torn-paper Kerala coastline, serif headline, stat buttons, ledger list.
   Right: pastel paper map with drawn landmarks and pins. One deliberate light look (paper), so no dark theme. */
:root{
  color-scheme:light;
  --canvas:#FFF3E7; --white:#FFFFFF; --ink:#030302; --graphite:#41413F; --stone:#8F8C8A; --ash:#E8DFD4; --cloud:#F6ECE1;
  --mint:#9BD8A9; --mint-soft:#DDF2E1; --marigold:#FDE99B; --peri:#B8CAF5; --peri-soft:#DCE5FB;
  --papaya:#FF4500; --papaya-soft:#FFE2D6; --azure:#0087FF;
  --land:#FBEEDF; --park:#CFEBD5; --water:#C5D5F6; --road:#FFFFFF; --label:#A39B92;
  --pe:var(--papaya); --pe-soft:var(--papaya-soft);
  --trust:var(--ink); --trust-soft:var(--mint-soft);
  --corp:#9C968F; --corp-soft:var(--cloud);
  --ind:var(--azure); --ind-soft:var(--peri-soft);
  --shadow:0 1px 1px rgba(3,3,2,.04),0 4px 8px rgba(3,3,2,.04),0 16px 32px rgba(3,3,2,.06),0 32px 64px rgba(3,3,2,.06);
  --shadow-sm:0 1px 1px rgba(3,3,2,.05),0 4px 12px rgba(3,3,2,.06);
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:440px 1fr;height:100%;min-height:0}
.rail{background:var(--canvas);display:flex;flex-direction:column;min-height:0;box-shadow:1px 0 0 var(--ash);position:relative;z-index:1}
.head{padding:0 26px 0 max(26px,env(safe-area-inset-left,0px))}
.skyline{display:block;width:calc(100% + 52px);margin:0 -26px;height:auto}
h1{font:400 46px/1.02 var(--serif);letter-spacing:-.035em;margin:14px 0 0;text-wrap:balance}
h1 em{font-style:italic}
.dek{color:var(--graphite);margin:12px 0 0;font-size:15px;max-width:38ch}

.split{margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{appearance:none;border:0;background:var(--white);border-radius:16px;padding:12px 14px 11px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);transition:opacity .15s,transform .15s}
.stat:hover{transform:translateY(-1px)}
.stat[aria-pressed="false"]{opacity:.4;box-shadow:none;background:transparent;outline:1px dashed var(--ash)}
.stat b{display:block;font:400 40px/1 var(--serif);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:6px;margin-top:6px;font:600 12px var(--sans);color:var(--graphite)}
.stat.pe b{color:var(--pe)}
.stat.pe{background:var(--papaya-soft)}
.stat.trust{background:var(--mint-soft)}
.stat.other{background:var(--white)}
.stat.other b{color:var(--stone)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px;gap:2px}
.bar i{display:block;height:100%}
.hint{font:500 12px var(--sans);color:var(--stone);margin-top:8px}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.dot.sq{border-radius:2.5px}
.dot.dia{border-radius:1.5px;transform:rotate(45deg) scale(.82)}
.dot.ring{background:transparent;box-shadow:inset 0 0 0 2.5px var(--c)}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.search{grid-column:1/-1}
.search,.sel{width:100%;box-sizing:border-box;border:1px solid var(--ash);background:var(--white);color:var(--ink);font:15px var(--sans);padding:10px 14px;border-radius:14px;min-width:0}
.sel{appearance:none;cursor:pointer;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--graphite) 50%),linear-gradient(135deg,var(--graphite) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.search::placeholder{color:var(--stone)}
.listwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.count{font:500 12px var(--sans);color:var(--stone);margin:14px 26px 0}
.list{margin:6px 0 0;padding:0 0 28px;overflow:auto;flex:1;min-height:0}
.grp{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:12px 26px 8px;background:var(--canvas);
  font:700 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--c);border-bottom:1px solid var(--ash)}
.grp span{color:var(--stone);font-weight:500}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:11px 26px;cursor:pointer;border-bottom:1px solid var(--ash)}
.row:hover{background:var(--cloud)}
.row.on{background:var(--white);box-shadow:inset 3px 0 0 var(--c)}
.row b{font:400 18px/1.2 var(--serif);letter-spacing:-.01em;display:block}
.row span{color:var(--graphite);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>div{min-width:0}
.price{font:600 12px var(--sans);letter-spacing:.02em;color:var(--graphite);white-space:nowrap;font-variant-numeric:tabular-nums}
.price s{text-decoration:none;opacity:.28}
.empty{padding:24px 26px;color:var(--graphite)}
.foot{font-size:12.5px;color:var(--stone);padding:16px 26px 0;line-height:1.5}

.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--land)}
.map{position:absolute;inset:0}
.maplibregl-canvas:focus{outline:none}
.lmk{pointer-events:none;display:block}
.lmk text{font:italic 400 7px var(--serif);fill:var(--graphite);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:2.4px}
.ink{stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.maplibregl-ctrl-attrib{font:11px var(--sans)!important;background:rgba(255,255,255,.8)!important;border-radius:999px!important}
.maplibregl-ctrl-bottom-right{margin:0 10px 10px 0}

.card{position:absolute;z-index:3;top:16px;right:66px;width:320px;max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;overscroll-behavior:contain;background:var(--white);border-radius:24px;box-shadow:var(--shadow);
  padding:18px 20px 18px;animation:pop .2s ease-out;box-sizing:border-box}
@keyframes pop{from{opacity:0;transform:translateX(10px)}}
.card .tag{display:inline-flex;align-items:center;gap:6px;font:700 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--c);background:var(--cs);padding:5px 10px 5px 8px;border-radius:999px}
.card h2{font:400 28px/1.05 var(--serif);letter-spacing:-.03em;margin:12px 28px 4px 0}
.card .area{color:var(--graphite);font-size:13.5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--ash);font-size:14px}
.card dt{color:var(--stone);font-weight:500}
.card dd{margin:0;font-weight:600}
.card p{margin:10px 0 0;font-size:13.5px;color:var(--graphite);line-height:1.5}
.card a{color:var(--azure);font:600 12.5px var(--sans);display:inline-block;margin-top:10px;text-decoration:none}
.card a:hover{text-decoration:underline}
.card .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;background:var(--cloud);color:var(--graphite);font-size:17px;cursor:pointer;border-radius:999px}
.card .x:hover{background:var(--ash);color:var(--ink)}
.alts{margin:14px -8px 0;padding:12px 8px 2px;background:var(--mint-soft);border-radius:16px}
.alts h3{margin:0 0 4px 6px;font:700 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:#1F7A3F}
.alt{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:6px;border-radius:10px;cursor:pointer;box-sizing:border-box}
.alt:hover{background:rgba(255,255,255,.7)}
.alt b{font:400 16px/1.2 var(--serif)}
.alt span{color:var(--graphite);font-size:12.5px}
.alt i{font:500 12px var(--sans);font-style:normal;color:var(--graphite);white-space:nowrap;align-self:center}

.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;display:flex;flex-direction:column;background:var(--white);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;z-index:2}
.zbtn{width:38px;height:38px;border:0;background:transparent;color:var(--ink);font:500 18px var(--sans);cursor:pointer}
.zbtn+.zbtn{border-top:1px solid var(--ash)}
.zbtn:hover{background:var(--cloud)}
.legend{position:absolute;left:16px;bottom:16px;background:var(--white);border-radius:999px;box-shadow:var(--shadow-sm);padding:8px 16px;display:flex;gap:16px;font:600 12px var(--sans);color:var(--graphite);z-index:2;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}

@media (max-width:820px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .rail{display:contents}
  .head{grid-row:1;padding:0 max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
  .skyline{width:calc(100% + 32px);margin:0 -16px}
  .mapwrap{grid-row:2;height:66vh;min-height:400px}
  .listwrap{grid-row:3}
  .row,.grp{padding-inline:16px}
  .count,.foot{margin-inline:16px;padding-inline:0}
  .empty{padding-inline:16px}
  h1{font-size:38px}
  .stat{padding:10px 11px}
  .stat b{font-size:32px}
  .card{left:10px;right:10px;bottom:10px;top:auto;width:auto;max-width:none;max-height:58%;padding:16px 16px;animation-name:sheet}
  @keyframes sheet{from{opacity:0;transform:translateY(24px)}}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

      <h1>Kerala Health <em>Money</em> Matrix</h1>

    <div class="listwrap">

  <section class="mapwrap" id="mapwrap" aria-label="Map of Kerala">

      <button class="zbtn" id="zreset" aria-label="Reset view" style="font-size:14px">⟲</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>
</div>

(function skyline(){
  const sv=document.getElementById('skyline'); let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const torn=(x,y,w,h)=>{let d=`M${x} ${y+rnd()*3}`; for(let i=6;i<=w;i+=6)d+=`L${x+i} ${(y+rnd()*3.5).toFixed(1)}`;
    for(let i=w;i>=0;i-=6)d+=`L${x+i} ${(y+h-rnd()*3.5).toFixed(1)}`; return d+'Z'};
  let o=`<path d="${torn(18,22,250,78)}" ${F('peri-soft')} transform="rotate(-1.6 140 60)"/>`+
        `<path d="${torn(236,14,190,84)}" ${F('marigold')} opacity=".85" transform="rotate(1.8 330 56)"/>`+
        `<circle cx="392" cy="40" r="13" ${F('papaya-soft')}/>`+
        `<path d="${torn(-6,108,452,26)}" ${F('mint')}/>`;
  const row=[['lighthouse',34,1.4],['gopuram',82,1.5],['palm',122,1.35],['houseboat',180,1.4],['nets',268,1.4],['palm',312,1.1],['elephant',350,1.35],['uru',410,1.15]];
  row.forEach(([id,x,k])=>{const m=LM.find(l=>l.id===id); o+=`<g transform="translate(${x} 112) scale(${k})">${m?m.svg():PALM()}</g>`});
  o+=`<path d="M-6 112.5H446" stroke="var(--ink)" stroke-width="1.1"/>`;
  sv.innerHTML=o;
})();

const bedsHtml=n=>n?`<span class="price">${Number(n).toLocaleString('en-IN')} beds</span>`:'';
const visible=p=>active.has(p.c) && (!fArea||p.area===fArea) && (!fCu||p.k===fCu) &&
  (!query || [p.n,p.a,p.area,p.o,p.cu,p.k].join(' ').toLowerCase().includes(query));
const isMobile=()=>innerWidth<=820;

/* ---------- real map: MapLibre + OpenFreeMap tiles, restyled to the paper palette ---------- */
const PAL={land:'#FBEEDF',park:'#CFEBD5',wood:'#D9EFDC',water:'#C5D5F6',road:'#FFFFFF',casing:'#EADBC9',rail:'#E2D3C1',
  bldg:'#F3E5D3',label:'#6F6A64',hood:'#A39B92',waterLabel:'#6F86BC',pe:'#FF4500',ind:'#0087FF',corp:'#9C968F',trust:'#030302'};
function paper(style){
  style.layers=style.layers.filter(l=>!/^(boundary|highway-shield|road_shield|airport|label_country|label_state)/.test(l.id)&&l.source!=='ne2_shaded');
  delete style.sources.ne2_shaded;
  style.layers=style.layers.map(l=>{
    const p=l.paint=l.paint||{}, id=l.id;
    if(id==='background') p['background-color']=PAL.land;
    else if(id==='park') {p['fill-color']=PAL.park; p['fill-opacity']=1}
    else if(id.startsWith('landcover')) {p['fill-color']=PAL.wood; p['fill-opacity']=.7}
    else if(id==='landuse_residential') p['fill-opacity']=0;
    else if(id==='water') p['fill-color']=PAL.water;
    else if(id==='waterway') p['line-color']=PAL.water;
    else if(id==='building') return {id:'building-3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13,
      paint:{'fill-extrusion-color':PAL.bldg,'fill-extrusion-opacity':.9,
        'fill-extrusion-height':['interpolate',['linear'],['zoom'],13,0,14.5,['coalesce',['get','render_height'],8]],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0]}};
    else if(l.type==='line'&&l['source-layer']==='transportation') p['line-color']= /casing/.test(id)?PAL.casing: /rail/.test(id)?PAL.rail:PAL.road;
    else if(l.type==='fill'&&l['source-layer']==='transportation') p['fill-color']=PAL.road;
    else if(l.type==='symbol'){
      p['text-color']= /water/.test(id)?PAL.waterLabel : id==='label_other'?PAL.hood : PAL.label;
      p['text-halo-color']=PAL.land; p['text-halo-width']=1.4; p['text-halo-blur']=0;
    }
    return l;
  });
  return style;
}
// pin icons, drawn once at 2x
function icon(kind){
  const r=2, S=18, c=document.createElement('canvas'); c.width=c.height=S*r; const g=c.getContext('2d'); g.scale(r,r); g.translate(S/2,S/2);
  g.lineJoin='round'; g.strokeStyle='#fff';
  if(kind==='pe'){g.lineWidth=1.8;g.fillStyle=PAL.pe;g.beginPath();g.roundRect(-6.5,-6.5,13,13,1.5);g.fill();g.stroke()}
  if(kind==='ind'){g.rotate(Math.PI/4);g.lineWidth=1.6;g.fillStyle=PAL.ind;g.beginPath();g.roundRect(-4.8,-4.8,9.6,9.6,1);g.fill();g.stroke()}
  if(kind==='corp'){g.beginPath();g.arc(0,0,5.2,0,7);g.fillStyle='#fff';g.fill();g.lineWidth=2.2;g.strokeStyle=PAL.corp;g.beginPath();g.arc(0,0,3.9,0,7);g.stroke()}
  if(kind==='trust'){g.beginPath();g.arc(0,0,4.4,0,7);g.fillStyle=PAL.trust;g.fill();g.lineWidth=1.4;g.stroke()}
  return {width:S*r,height:S*r,data:g.getImageData(0,0,S*r,S*r).data};
}
const START=()=>isMobile()?{center:[76.25,10.35],zoom:6.2,pitch:20,bearing:-6}:{center:[76.30,10.40],zoom:7.0,pitch:32,bearing:-10};
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':PAL.land}}]},
  ...START(),minZoom:5.6,maxZoom:18.5,maxPitch:60,maxBounds:[[71.0,6.0],[81.5,14.8]],attributionControl:{compact:true},dragRotate:true});
map.touchZoomRotate.disableRotation();
map.once('idle',()=>{const a=document.querySelector('.maplibregl-ctrl-attrib');a&&a.classList.remove('maplibregl-compact-show')});
let ready=false;
const fc=()=>({type:'FeatureCollection',features:PLACES.map(p=>({type:'Feature',id:p.i,
  geometry:{type:'Point',coordinates:[p.ll[1],p.ll[0]]},properties:{i:p.i,c:p.c,o:3-ORDER[p.c],v:visible(p)?1:0}}))});
fetch('https://tiles.openfreemap.org/styles/positron').then(r=>r.json()).then(st=>{
  map.once('style.load',()=>{if(ready)return;
    ['pe','ind','corp','trust'].forEach(k=>{const im=icon(k);map.addImage('pin-'+k,{width:im.width,height:im.height,data:new Uint8Array(im.data.buffer)},{pixelRatio:2})});
    map.addSource('places',{type:'geojson',data:fc()});
    const col=['match',['get','c'],'pe',PAL.pe,'ind',PAL.ind,'corp',PAL.corp,PAL.trust];
    map.addLayer({id:'halo-near',type:'circle',source:'places',filter:['in',['get','i'],['literal',[]]],paint:{'circle-radius':13,'circle-color':col,'circle-opacity':.16,'circle-pitch-alignment':'map'}});
    map.addLayer({id:'halo-on',type:'circle',source:'places',filter:['==',['get','i'],-1],paint:{'circle-radius':18,'circle-color':col,'circle-opacity':.25,'circle-stroke-width':1.5,'circle-stroke-color':col,'circle-stroke-opacity':.5}});
    map.addLayer({id:'pins',type:'symbol',source:'places',layout:{'icon-image':['concat','pin-',['get','c']],'icon-allow-overlap':true,'icon-ignore-placement':true,
      'symbol-sort-key':['+',['get','o'],['*',['get','v'],10]],'icon-size':['interpolate',['linear'],['zoom'],6,.72,10,.95,14,1.25,17,1.5]},
      paint:{'icon-opacity':['case',['==',['get','v'],1],1,.12]}});
    ready=true; render(); if(selected!==null) select(selected,false,true);
    const h=decodeURIComponent(location.hash.slice(1)); const hp=h&&PLACES.find(p=>slug(p.n)===h); if(hp) select(hp.i,true);
  });
  map.setStyle(paper(st),{diff:false});
}).catch(()=>{document.getElementById('map').insertAdjacentHTML('beforeend','<p style="position:absolute;inset:auto 16px 16px;font:13px var(--sans);color:var(--graphite)">Map tiles didn\'t load. The list still works.</p>')});

/* landmarks as markers: hand-drawn, base sits on the real spot, scale with zoom */
LM.forEach(m=>{
  const box=document.createElement('div'); box.innerHTML=`<svg class="lmk" viewBox="-40 -62 80 74" width="80" height="74">${m.svg()}<text y="9">${esc(m.name)}</text></svg>`;
  m.el=box.firstChild; m.mk=new maplibregl.Marker({element:box,anchor:'bottom',pitchAlignment:'viewport',rotationAlignment:'viewport'}).setLngLat([m.ll[1],m.ll[0]]).addTo(map);
  box.style.pointerEvents='none';
});
function sizeLandmarks(){const z=map.getZoom(), s=Math.max(.5,Math.min(1.6,.5*Math.pow(1.3,z-7)));
  LM.forEach(m=>{m.el.setAttribute('width',80*s);m.el.setAttribute('height',74*s);m.mk.setOffset([0,12*s]);m.el.style.opacity=z<5.9?0:1;m.el.lastChild.style.display=s<.8?'none':''})}
map.on('zoom',sizeLandmarks); sizeLandmarks();

/* forgiving taps: nearest pin within a finger-sized box */
const coarse=matchMedia('(pointer:coarse)').matches;
function pinAt(pt,R){ if(!ready)return null;
  const fs=map.queryRenderedFeatures([[pt.x-R,pt.y-R],[pt.x+R,pt.y+R]],{layers:['pins']}).filter(f=>f.properties.v===1);
  let best=null,bd=1e9; fs.forEach(f=>{const q=map.project(f.geometry.coordinates),d=(q.x-pt.x)**2+(q.y-pt.y)**2-(f.properties.c==='pe'?4:0);if(d<bd){bd=d;best=f}});
  return best?PLACES[best.properties.i]:null;
}
map.on('click',e=>{const p=pinAt(e.point,coarse?22:13); if(p) select(p.i,false); else if(selected!==null) select(null)});
map.on('mousemove',e=>{map.getCanvas().style.cursor=pinAt(e.point,10)?'pointer':''});
document.getElementById('zin').onclick=()=>map.zoomIn({duration:350});
document.getElementById('zout').onclick=()=>map.zoomOut({duration:350});
document.getElementById('zreset').onclick=()=>{select(null);map.flyTo({...START(),padding:{top:0,right:0,bottom:0,left:0},duration:1100})};

/* ---------- nearby independents ---------- */
function alternatives(p){
  const pool=PLACES.filter(q=>q.c==='trust'&&q!==p).map(q=>({q,m:meters(p.ll,q.ll)}));
  const same=pool.filter(x=>x.q.k===p.k&&x.m<40000).sort((a,b)=>a.m-b.m);
  const any=pool.filter(x=>x.m<60000).sort((a,b)=>a.m-b.m);
  const out=[...same.slice(0,2)]; for(const x of any){if(out.length>=3)break; if(!out.includes(x))out.push(x)}
  return out.sort((a,b)=>a.m-b.m);
}
const dist=m=>m<1000?`${Math.max(100,Math.round(m/100)*100)} m`:`${(m/1000).toFixed(m<10000?1:0)} km`;

/* ---------- card ---------- */
let card=null;
const wrap=document.getElementById('mapwrap');
function showCard(p){
  card&&card.remove(); const C=CATS[p.c];
  card=document.createElement('div'); card.className='card'; card.style.setProperty('--c',css(C.c)); card.style.setProperty('--cs',css(C.cs));
  const host=(()=>{try{return new URL(p.src).hostname.replace(/^www\./,'')}catch{return ''}})();
  const alts = (p.c==='pe'||p.c==='corp') ? alternatives(p) : [];
  nearIds=alts.map(a=>a.q.i);
  card.innerHTML=`<button class="x" aria-label="Close">×</button>
    <span class="tag"><i class="dot ${shapeCls(C)}"></i>${C.label}</span>
    <h2>${esc(p.n)}</h2><div class="area">${esc([p.cu,p.a,p.ap?'pin approximate':''].filter(Boolean).join(' · '))}</div>
    <dl>${p.o?`<dt>${{pe:'Backer',corp:'Owner',ind:'Owned by',trust:'Run by'}[p.c]}</dt><dd>${esc(p.o)}</dd>`:''}${p.y?`<dt>${p.c==='pe'||p.c==='corp'?'Since':'Founded'}</dt><dd>${esc(p.y)}</dd>`:''}${p.beds?`<dt>Beds</dt><dd>${Number(p.beds).toLocaleString('en-IN')}</dd>`:''}</dl>
    ${p.note?`<p>${esc(p.note)}</p>`:''}
    ${p.src?`<a target="_blank" rel="noopener" href="${esc(p.src)}">Source: ${esc(host)} ↗</a>`:''}
    ${alts.length?`<div class="alts"><h3>Not-for-profit nearby</h3>${alts.map(a=>`<button class="alt" data-i="${a.q.i}"><div><b>${esc(a.q.n)}</b><br><span>${esc([a.q.cu,a.q.town].filter(Boolean).join(' · '))}</span></div><i>${dist(a.m)}</i></button>`).join('')}</div>`:''}`;
  card.querySelector('.x').onclick=()=>select(null);
  card.querySelectorAll('.alt').forEach(b=>b.onclick=()=>select(+b.dataset.i,true));
  wrap.appendChild(card);
}
function highlight(){ if(!ready)return;
  map.setFilter('halo-on',['==',['get','i'],selected===null?-1:selected]);
  map.setFilter('halo-near',['in',['get','i'],['literal',selected===null?[]:nearIds]]);
}
const slug=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function select(i,fromList,silent){
  selected=i;
  try{history.replaceState(null,'',i===null?location.pathname:'#'+slug(PLACES[i].n))}catch{}
  document.querySelectorAll('.row.on').forEach(r=>r.classList.remove('on'));
  if(i===null){card&&card.remove();card=null;nearIds=[];highlight();return}
  const p=PLACES[i]; p.row&&p.row.classList.add('on');
  const mobile=isMobile();
  showCard(p); highlight(); if(silent)return;
  const ll=[p.ll[1],p.ll[0]], z=map.getZoom(), zoom=fromList?Math.max(z,13.2):Math.max(z,10.5);
  if(mobile){
    map.flyTo({center:ll,zoom,padding:{top:20,bottom:card.offsetHeight+20,left:0,right:0},duration:fromList?1300:700,essential:true});
  } else {
    const pad={top:0,bottom:0,left:0,right:card.offsetWidth+82}, sx=map.project(ll).x, W=map.getContainer().clientWidth;
    if(fromList||sx>W-pad.right-30||zoom!==z) map.flyTo({center:ll,zoom,padding:pad,duration:fromList?1400:700,essential:true});
  }
  if(fromList&&mobile) wrap.scrollIntoView({behavior:'smooth',block:'start'});
  if(!fromList&&!mobile&&p.row) p.row.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ---------- rail ---------- */
const listEl=document.getElementById('list'), filtersEl=document.getElementById('filters');
const counts=Object.fromEntries(Object.keys(CATS).map(k=>[k,PLACES.filter(p=>p.c===k).length]));
const stats=[...document.querySelectorAll('.stat')];
stats.forEach(b=>b.onclick=()=>{
  const g=b.dataset.g.split(','); const all=Object.keys(CATS);
  const isolated = active.size===g.length && g.every(k=>active.has(k));
  active.clear(); (isolated?all:g).forEach(k=>active.add(k)); render();
});
document.getElementById('legend').innerHTML=Object.values(CATS).map(C=>`<span><i class="dot ${shapeCls(C)}" style="--c:${css(C.c)}"></i>${C.label}</span>`).join('');
const bar=document.getElementById('bar');
['pe','corp','ind','trust'].forEach(k=>{const i=document.createElement('i');i.style.background=css(CATS[k].c);i.style.flexGrow=counts[k];i.title=`${CATS[k].label}: ${counts[k]}`;bar.appendChild(i)});
document.getElementById('nPe').textContent=counts.pe;
document.getElementById('nTrust').textContent=counts.trust;
document.getElementById('nOther').textContent=counts.corp+counts.ind;

const uniq=k=>[...new Set(PLACES.map(p=>p[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const fill=(id,vals)=>{const s=document.getElementById(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=`${v} (${PLACES.filter(p=>p[id==='fArea'?'area':'k']===v).length})`;s.appendChild(o)})};
fill('fArea',uniq('area')); fill('fCu',uniq('k'));

const groups={};
[...PLACES].sort((a,b)=>(ORDER[a.c]-ORDER[b.c])||a.n.localeCompare(b.n)).forEach(p=>{
  const C=CATS[p.c];
  if(!groups[p.c]){const h=document.createElement('div');h.className='grp';h.style.setProperty('--c',css(C.c));h.innerHTML=`${C.label}<span></span>`;listEl.appendChild(h);groups[p.c]=h} const r=document.createElement('div'); r.className='row'; r.tabIndex=0; r.setAttribute('role','option');
  r.style.setProperty('--c',css(C.c)); r.style.setProperty('--cs',css(C.cs));
  r.innerHTML=`<i class="dot ${shapeCls(C)}"></i><div><b>${esc(p.n)}</b><span>${esc([p.cu,p.town].filter(Boolean).join(' · '))}${p.o&&(p.c==='pe'||p.c==='corp')?' · '+esc(p.o):''}</span></div>${bedsHtml(p.beds)}`;
  r.onclick=()=>select(p.i,true); r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.i,true)}};
  p.row=r; listEl.appendChild(r);
});
const emptyEl=document.createElement('div'); emptyEl.className='empty'; emptyEl.textContent='Nothing matches. Try another search or clear a filter.'; listEl.appendChild(emptyEl);
const foot=document.createElement('div'); foot.className='foot';
foot.textContent='Ownership as reported publicly, checked Nov 2026. Private hospitals only; government hospitals are not shown, and this is a selection, not a full register. "PE-backed" includes significant minority stakes and hospitals held through a PE-controlled parent. "Not-for-profit" covers charitable trusts, church missions and co-operatives; "family-owned" covers founding doctors, families and local business groups. Hospitals run under a lease or management contract are listed under their operator. Bed counts are as published. Ownership changes fast; each card links its source. This is not a rating of care.';
listEl.appendChild(foot);
const countEl=document.getElementById('count');

function render(){
  stats.forEach(b=>b.setAttribute('aria-pressed',b.dataset.g.split(',').some(k=>active.has(k))));
  let n=0,pe=0; const per={}; PLACES.forEach(p=>{const v=visible(p); p.row.hidden=!v; if(v){n++; p.c==='pe'&&pe++; per[p.c]=(per[p.c]||0)+1}});
  Object.entries(groups).forEach(([k,h])=>{h.hidden=!per[k]; h.querySelector('span').textContent=per[k]||0});
  emptyEl.hidden=n>0;
  countEl.textContent = n===PLACES.length ? `${n} HOSPITALS` : `${n} OF ${PLACES.length} HOSPITALS · ${pe} PE-BACKED`;
  if(selected!==null&&!visible(PLACES[selected])) select(null);
  if(ready) map.getSource('places').setData(fc());
}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
document.getElementById('fArea').addEventListener('change',e=>{fArea=e.target.value;render()});
document.getElementById('fCu').addEventListener('change',e=>{fCu=e.target.value;render()});
addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});

render();
</script>
